[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bnlearn"
dynamic = ["version"]
authors = [{ name = "Erdogan Taskesen", email = "erdogant@gmail.com" },]
description = "bnlearn is a Python package for Causal Discovery by learning the graphical structure of Bayesian networks, parameter learning, inference and sampling methods."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["Python", "causal discovery", "causal learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pgmpy>=1.1.2,<1.2",
    "networkx>=2.7.1",
    "matplotlib>=3.3.4",
    "numpy>=1.24.1",
    "pandas",
    "tqdm",
    "ismember",
    "scikit-learn",
    "python-louvain",
    "packaging",
    "df2onehot",
    "pypickle>=2.0.2",
    "tabulate",
    "datazets>=1.1.2",
    "setgraphviz>=1.0.3",
    # bnlearn.CITests imports scipy directly; >=1.14.0 for Python 3.13 wheels.
    "scipy>=1.14.0",
    # lingam 1.13.0 pins scipy<=1.13.1, which has no Python 3.13 wheels and
    # forces a from-source scipy build (fails without OpenBLAS). Cap until lingam lifts the scipy ceiling.
    "lingam<1.13",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
bnlearn = "bnlearn.skills_install:main"

[project.urls]
Homepage = "https://erdogant.github.io/bnlearn"
Download = "https://github.com/erdogant/bnlearn/archive/{version}.tar.gz"

[tool.setuptools]
packages = ["bnlearn"]
include-package-data = true

[tool.setuptools.package-data]
bnlearn = ["skills/**/*"]

[tool.setuptools.dynamic]
version = { attr = "bnlearn.__version__" }